name: Agent Daily

on:
  workflow_dispatch:
  schedule:
    - cron: "15 6 * * *"

permissions:
  contents: write

concurrency:
  group: agent-daily
  cancel-in-progress: false

jobs:
  agent-daily:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Run autonomous daily loop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AIBTC_BITCOIN_ADDRESS: ${{ vars.AIBTC_BITCOIN_ADDRESS }}
        run: npm run agent-daily

      - name: Upload agent artifacts
        uses: actions/upload-artifact@v6
        with:
          name: aibtc-agent-daily-artifacts
          path: |
            data/dry-runs
            data/reports
            data/live-inputs
            data/experiments/optimization
            data/queues
            data/filing-queue
            data/state
            data/outcomes
          if-no-files-found: warn

      - name: Commit agent memory and queues
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/briefs/ \
            data/dry-runs/ \
            data/reports/ \
            data/live-inputs/ \
            data/experiments/optimization/ \
            data/outcomes/ \
            data/training/ \
            data/state/ \
            dashboard/ \
            data/logs/ \
            memory/ \
            README.md
          git add -f \
            data/queues/ \
            data/filing-queue/
          git diff --cached --quiet && echo "no changes" || git commit -m "chore: run autonomous daily agent loop [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}
