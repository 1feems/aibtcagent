name: Check Outcomes

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"
    - cron: "0 20 * * *"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Run outcome checker
        env:
          AIBTC_BITCOIN_ADDRESS: ${{ vars.AIBTC_BITCOIN_ADDRESS }}
        run: npm run check-outcomes

      - name: Commit new outcomes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/outcomes/approvals/ data/state/filed-signals.json
          git diff --cached --quiet && echo "no changes" || git commit -m "chore: record signal outcomes [skip ci]"
          git push
